<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {{with .MetaDescription}}<meta name="description" content="{{.}}">{{end}}
  <title>{{if .PageTitle}}{{.PageTitle}} · {{end}}{{.SiteName}}</title>
  <link rel="stylesheet" href="/static/site.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="shell topbar-inner">
      <a class="brand" href="/">Sheffield Live</a>
      <nav class="nav">
        <a class="{{if eq .Active "events"}}active{{end}}" {{if eq .Active "events"}}aria-current="page"{{end}} href="/">Events</a>
        <a class="{{if eq .Active "venues"}}active{{end}}" {{if eq .Active "venues"}}aria-current="page"{{end}} href="/venues">Venues</a>
        {{if .AdminAuthenticated}}
        <form class="nav-logout" method="post" action="/admin/logout">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
          <button type="submit">Log out</button>
        </form>
        {{end}}
      </nav>
    </div>
  </header>

  <main id="main" class="shell main">
    {{.Content}}
  </main>

  <footer class="shell footer">
    <p>Sheffield listings with source links.</p>
  </footer>
</body>
</html>
